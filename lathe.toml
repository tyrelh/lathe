# The agent roster. Embedded into the binary at build time, so editing this
# file means rebuilding — `go run .` during development, `make build` to deploy.

# Paths no agent may write and no plan may name. An entry ending in "/" is a
# directory name, matched at any depth; anything else is a glob matched against
# the basename. This gates the planner's file list; the guard checks the same
# list on the resolved path, extending protection past the repo boundary.
protected = [".git/", ".env*", "*.pem", "*.key"]

# Commands the guard refuses to run, as Go regexps (JavaScript reads the same
# ones). Four agents get a shell — the tester, and the three that read git to
# judge a branch name, a commit message and a pull request — and this narrows
# the obvious ways out of the repo without closing them: a heredoc or
# `python -c` gets past it. `git push` and `git commit` are here because lathe
# performs both itself, through exec.Command, which never meets this list.
bash_denied = [
  "\\bgit\\s+push\\b",
  "\\bgit\\s+commit\\b",
  "\\brm\\s+-[a-zA-Z]*r",
  "\\bcurl\\b",
  "\\bwget\\b",
  "\\bsudo\\b",
  "\\bssh\\b",
  "\\bscp\\b",
]

# How long a code phase's command may run. A code phase is lathe's own work, not
# an agent's, so its bound is set here rather than borrowed from whichever agent
# happened to discover the command.
command_timeout = "10m"

[defaults]
provider = "moonshotai"
model    = "kimi-k2.7-code"
# A request, not a guarantee: kimi-k2.7-code has thinking always on and no dial,
# and Pi drops the level for models that do not take one. The roster pins a
# model per agent below, so this default now only reaches the scout.
thinking = "medium"
# No `bash`, no `write`, no `edit`: with no write-capable tool and no shell
# read-only agents cannot modify the repo they were pointed at.
# Granting bash would reintroduce the whole risk surface on its own.
tools    = ["read", "grep", "find", "ls"]
# A model that stalls otherwise hangs lathe until someone notices.
timeout  = "10m"

# Find and report where things live; change nothing.
[[agents]]
name   = "scout"
system = "prompts/scout/system.md"
user   = "prompts/scout/user.md"

# Read the repo and produce the plan the builder implements; change nothing.
# kimi-k3 for the 1M context: a plan is only as good as how much of the repo the
# planner got to read, and planning is the cheap phase to spend that on.
[[agents]]
name   = "planner"
model  = "kimi-k3"
system = "prompts/planner/system.md"
user   = "prompts/planner/user.md"

# Review the plan against the repository before the builder gets its write scope.
# Match the planner's context budget so omissions can be checked in the code.
[[agents]]
name   = "plan-reviewer"
model  = "kimi-k3"
system = "prompts/plan-reviewer/system.md"
user   = "prompts/plan-reviewer/user.md"

# Implement the accepted plan, with no shell. Pinned rather than inherited: the
# builder is the agent that writes, so which model does that is not a thing a
# change to [defaults] should be able to swap quietly.
[[agents]]
name   = "builder"
model  = "kimi-k2.7-code"
system = "prompts/builder/system.md"
user   = "prompts/builder/user.md"
tools  = ["read", "grep", "find", "ls", "write", "edit"]

# Discover and exercise the test command; lathe independently verifies its exit.
[[agents]]
name = "tester"
model = "kimi-k2.6"
system = "prompts/tester/system.md"
user = "prompts/tester/user.md"
tools = ["read", "grep", "find", "ls", "bash"]

# Name the branch the change lands on, following whatever the repository already
# does. bash to read git history and remote branches; lathe creates the branch.
[[agents]]
name = "brancher"
model = "kimi-k2.6"
system = "prompts/brancher/system.md"
user = "prompts/brancher/user.md"
tools = ["read", "grep", "find", "ls", "bash"]

# Write the commit message for the implemented change. lathe stages the exact
# paths and runs the commit, so the message is the whole of this agent's work.
[[agents]]
name = "committer"
model = "kimi-k2.6"
system = "prompts/committer/system.md"
user = "prompts/committer/user.md"
tools = ["read", "grep", "find", "ls", "bash"]

# Write the pull request title and body from the repository's template and its
# recently merged pull requests. lathe pushes and runs gh pr create.
[[agents]]
name = "pr-author"
model = "kimi-k2.6"
system = "prompts/pr-author/system.md"
user = "prompts/pr-author/user.md"
tools = ["read", "grep", "find", "ls", "bash"]
