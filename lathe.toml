# The agent roster. Embedded into the binary at build time, so editing this
# file means rebuilding — `go run .` during development, `make build` to deploy.

# Paths no agent may write and no plan may name. An entry ending in "/" is a
# directory name, matched at any depth; anything else is a glob matched against
# the basename. This gates the planner's file list; the guard checks the same
# list on the resolved path, extending protection past the repo boundary.
protected = [".git/", ".env*", "*.pem", "*.key"]

# Commands the guard refuses to run, as Go regexps (JavaScript reads the same
# ones). Only the tester ever gets a shell, and this narrows the obvious ways
# out of the repo without closing them: a heredoc or `python -c` gets past it.
bash_denied = [
  "\\bgit\\s+push\\b",
  "\\brm\\s+-[a-zA-Z]*r",
  "\\bcurl\\b",
  "\\bwget\\b",
  "\\bsudo\\b",
  "\\bssh\\b",
  "\\bscp\\b",
]

[defaults]
provider = "moonshotai"
model    = "kimi-k2.7-code"
# A request, not a guarantee: kimi-k2.7-code has thinking always on and no dial,
# and Pi drops the level for models that do not take one. The roster pins a
# model per agent below, so this default now only reaches the scout.
thinking = "medium"
# No `bash`, no `write`, no `edit`: with no write-capable tool and no shell
# there is no mechanism by which a v0 run can modify the repo it was pointed at.
# Granting bash would reintroduce the whole risk surface on its own.
tools    = ["read", "grep", "find", "ls"]
# A model that stalls otherwise hangs lathe until someone notices.
timeout  = "10m"

# Find and report where things live; change nothing.
[[agents]]
name   = "scout"
system = "prompts/scout/system.md"
user   = "prompts/scout/user.md"

# Read the repo and produce the plan the builder implements; change nothing.
# kimi-k3 for the 1M context: a plan is only as good as how much of the repo the
# planner got to read, and planning is the cheap phase to spend that on.
[[agents]]
name   = "planner"
model  = "kimi-k3"
system = "prompts/planner/system.md"
user   = "prompts/planner/user.md"

# Implement the accepted plan, with no shell. Pinned rather than inherited: the
# builder is the agent that writes, so which model does that is not a thing a
# change to [defaults] should be able to swap quietly.
[[agents]]
name   = "builder"
model  = "kimi-k2.7-code"
system = "prompts/builder/system.md"
user   = "prompts/builder/user.md"
tools  = ["read", "grep", "find", "ls", "write", "edit"]

# Discover and exercise the test command; lathe independently verifies its exit.
[[agents]]
name = "tester"
model = "kimi-k2.7-code"
system = "prompts/tester/system.md"
user = "prompts/tester/user.md"
tools = ["read", "grep", "find", "ls", "bash"]
