<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lathe</title>
<style>
  /* Catppuccin Macchiato (dark) and Latte (light). */
  :root {
    color-scheme: dark;
    --bg: #1a1b26; --panel: #292e42; --line: #3b4261; --card: #16161e;
    --fg: #c0caf5; --dim: #565f89;
    --ok: #9ece6a; --fail: #f7768e; --run: #e0af68; --cost: #bb9af7;
    --blue: #7aa2f7; --cyan: #7dcfff; --sky: #2ac3de; --teal: #73daca;
    --orange: #ff9e64; --purple: #9d7cd8; --green: #9ece6a; --magenta: #bb9af7;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #d5d6db; --panel: #cbccd1; --line: #9699a3; --card: #e6e7ed;
      --fg: #343b58; --dim: #4c505e;
      --ok: #385f0d; --fail: #8c4351; --run: #8f5e15; --cost: #5a3e8e;
      --blue: #34548a; --cyan: #0f4b6e; --sky: #166775; --teal: #33635c;
      --orange: #965027; --purple: #5a4a78; --green: #485e30; --magenta: #8c4a7a;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #d5d6db; --panel: #cbccd1; --line: #9699a3; --card: #e6e7ed;
    --fg: #343b58; --dim: #4c505e;
    --ok: #385f0d; --fail: #8c4351; --run: #8f5e15; --cost: #5a3e8e;
    --blue: #34548a; --cyan: #0f4b6e; --sky: #166775; --teal: #33635c;
    --orange: #965027; --purple: #5a4a78; --green: #485e30; --magenta: #8c4a7a;
  }
  * { box-sizing: border-box; }

  /* The shell: bars span the viewport, the rail sits between them, and only
     the main pane scrolls — so navigation and status never leave the screen. */
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    --rail: 190px;
    display: grid;
    grid-template-columns: var(--rail) 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top" "nav main" "bottom bottom";
  }
  body[data-nav="collapsed"] { --rail: 46px; }

  header { grid-area: top; padding: 8px 14px; border-bottom: 1px solid var(--line);
           background: var(--card);
           display: flex; align-items: center; gap: 10px; }
  header b { letter-spacing: .1em; }
  #version { color: var(--dim); }
  #theme { margin-left: auto; background: none; border: 1px solid var(--line);
           color: var(--dim); font: inherit; line-height: 1; cursor: pointer;
           border-radius: 4px; padding: 3px 7px; }
  #theme:hover { color: var(--fg); background: var(--panel); }

  nav { grid-area: nav; border-right: 1px solid var(--line); padding: 8px 6px;
        background: var(--card);
        display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  nav a, #collapse {
    display: flex; align-items: center; gap: 10px; padding: 5px 8px;
    color: var(--dim); text-decoration: none; border-radius: 4px;
    border: none; background: none; font: inherit; cursor: pointer;
    white-space: nowrap; width: 100%; text-align: left;
  }
  nav a:hover, #collapse:hover { background: var(--panel); color: var(--fg); }
  nav a[aria-current="page"] { background: var(--panel); color: var(--fg);
                               box-shadow: inset 2px 0 0 var(--cost); }
  nav svg { flex: none; width: 14px; height: 14px; }
  #collapse { margin-top: auto; }
  body[data-nav="collapsed"] .label { display: none; }

  main { grid-area: main; overflow: auto; padding: 16px; }
  footer { grid-area: bottom; border-top: 1px solid var(--line); background: var(--card);
           padding: 4px 14px; color: var(--dim); display: flex; gap: 14px;
           white-space: nowrap; overflow: hidden; }
  #note { margin-left: auto; }
  #note.stale { color: var(--run); }
  #follow-label { display: none; align-items: center; gap: 4px; }
  #follow-label input { margin: 0; }

  h2 { font-size: 12px; color: var(--dim); text-transform: uppercase;
       letter-spacing: .1em; margin: 24px 0 8px; }
  h2:first-child { margin-top: 0; }

  /* Each section sits in its own box, so a page reads as a set of panels
     rather than one continuous column of rows. */
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .card > h2 { margin-top: 0; }
  .card > :last-child { margin-bottom: 0; }
  table { width: 100%; border-collapse: collapse; }
  .card table tr:last-child td { border-bottom: none; }
  td, th { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line);
           vertical-align: top; white-space: nowrap; text-align: left;
           font-weight: normal; }
  th { color: var(--dim); }
  td.wrap { white-space: normal; color: var(--dim); width: 100%; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.run { cursor: pointer; }
  tr.run:hover td { background: var(--panel); }
  .dim { color: var(--dim); }
  .cost { color: var(--cost); font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .fail { color: var(--fail); } .running { color: var(--run); }
  a { color: var(--fg); cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cost); outline-offset: 1px; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--dim); }
  summary { cursor: pointer; overflow-wrap: anywhere; }
  details[open] > summary { margin-bottom: 8px; }
  details pre { padding: 8px; background: var(--panel); }
  pre.fail { color: var(--fail); }
  /* The phase chart: one row per graph node, time running left to right from
     the run's start. Block geometry is in percent so it follows the width;
     sublanes and label placement are pixels, measured after render by
     layout(). */
  .gantt { display: grid; grid-template-columns: fit-content(18ch) minmax(0, 1fr);
           gap: 4px 10px; align-items: start; }
  .node { color: var(--fg); font-weight: 600; line-height: 40px; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; }
  .track { position: relative; height: 40px; background: var(--panel); border-radius: 3px; }
  /* The fill says what kind of phase a block is, one hue per owning agent;
     the border says how it went, and the label says both in words. */
  .block {
    --hue: var(--dim);
    position: absolute; top: 1px; height: 38px; min-width: 0; padding: 0; margin: 0;
    border: 1px solid var(--hue); border-radius: 3px; overflow: visible;
    background: color-mix(in srgb, var(--hue) 40%, var(--card));
    color: var(--fg); font: inherit; font-size: 12px; line-height: 16px;
    text-align: left; cursor: pointer;
  }
  .block[data-owner="scout"] { --hue: var(--cyan); }
  .block[data-owner="planner"] { --hue: var(--blue); }
  .block[data-owner="plan-reviewer"] { --hue: var(--purple); }
  .block[data-owner="builder"] { --hue: var(--teal); }
  .block[data-owner="tester"] { --hue: var(--orange); }
  .block[data-owner="code-review-general"] { --hue: var(--purple); }
  .block[data-owner="code-review-security"] { --hue: var(--fail); }
  .block[data-owner="code-review-slop"] { --hue: var(--sky); }
  .block[data-owner="adjudicator"] { --hue: var(--blue); }
  .block[data-owner="brancher"] { --hue: var(--sky); }
  .block[data-owner="committer"] { --hue: var(--green); }
  .block[data-owner="pr-author"] { --hue: var(--magenta); }
  .block.fail { border: 2px solid var(--fail); }
  .block.running { border: 2px solid var(--run); }
  .block.interrupted { border: 1px dashed var(--fg); }
  .block[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); z-index: 1; }
  /* Two lines, the name over model · status · cost. layout() places each
     piece inside the block or beside it; a dot fills the gap between pieces
     sharing a line. */
  .block .piece { position: absolute; left: 4px; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
  .block .piece[data-line="0"] { top: calc(50% - 16px); }
  .block .piece[data-line="1"] { top: 50%; }
  .block[data-lines="1"] .piece { top: calc(50% - 8px); }
  .block .piece[data-sep="1"] { padding-left: 14px; }
  .block .piece[data-sep="1"]::before { content: '·'; position: absolute; left: 0; width: 14px;
                                        text-align: center; opacity: .6; }
  /* A status mark sits a space from the name, not a dot: pulled into the gap
     layout() left for one, which only leaves more room after it. */
  .block .piece.mark[data-sep="1"] { margin-left: -8px; }
  .block .piece.mark[data-sep="1"]::before { content: none; }
  .untimed { display: flex; flex-wrap: wrap; gap: 6px; }
  .untimed .block { position: static; height: auto; padding: 1px 4px; }
  .untimed .block .piece { position: static; }
  .untimed .piece + .piece::before { content: ' · '; color: var(--dim); }
  .untimed .piece.mark::before { content: ' '; }
  .facts { width: auto; margin: 8px 0; }
  .phase-output { max-width: 100ch; overflow-wrap: anywhere; }
  .phase-output h3 { margin: 12px 0 8px; }
  .phase-output h4 { margin: 14px 0 6px; color: var(--dim); font-weight: normal; }
  .phase-output p, .phase-output li { white-space: pre-wrap; }
  .phase-output li { margin-bottom: 6px; }
  .phase-output li > h4:first-child { margin-top: 0; }
  .phase-output ul, .phase-output ol { margin-top: 0; padding-left: 3ch; }
  #phase > details { margin-top: 14px; }
  #phase > details > summary { color: var(--dim); }
  #phase > details > summary.fail { color: var(--fail); }
  #phase p { margin: 8px 0 4px; }
  #log td:last-child { white-space: normal; width: 100%; }

  /* Two compact lifetime totals, then the rankings in two independent columns. */
  .totals { display: flex; gap: 40px; margin-bottom: 8px; }
  .totals b { display: block; font-size: 20px; font-weight: normal;
              font-variant-numeric: tabular-nums; }
  .totals .cost b { color: var(--cost); }
  .totals span { color: var(--dim); font-size: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  @media (max-width: 720px) {
    body { --rail: 46px; }
    .label { display: none; }
    .totals { gap: 20px; }
    .lo { display: none; }
  }
</style>

<header>
  <b>lathe</b> <span id="version" class="dim">…</span>
  <button id="theme" type="button" title="Theme: follow system">◐</button>
</header>

<nav>
  <a id="nav-overview" href="#/overview" title="Overview">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/>
      <rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/>
    </svg><span class="label">Overview</span>
  </a>
  <a id="nav-runs" href="#/runs" title="Runs">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M1.5 3.5h13M1.5 8h13M1.5 12.5h13"/>
    </svg><span class="label">Runs</span>
  </a>
  <button id="collapse" type="button" aria-expanded="true" title="Collapse navigation">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
      <path d="M10 3.5 5.5 8l4.5 4.5"/>
    </svg><span class="label">Collapse</span>
  </button>
</nav>

<main id="app"></main>

<footer>
  <span id="status"></span>
  <span id="note"></span>
  <label id="follow-label"><input type="checkbox" id="follow-box"> follow</label>
</footer>

<script>
const $ = id => document.getElementById(id);
const app = $('app'), bar = $('status'), note = $('note');
const followBox = $('follow-box'), followLabel = $('follow-label');
const PAGE = 500;   // the server's per-poll event cap
// How often each page asks for fresh data. Overview aggregates the whole
// database and changes slowly; a live run's log does not.
const POLL = {overview: 5000, runs: 2000, run: 1000, missing: 0};

// phase_id -> {model, tokens, cost}, summed from the usage events as they
// stream past. A phase spends once per model response, so a corrected phase is
// the sum of every response in every try — which is the number worth seeing.
const spend = new Map(), inputs = new Map(), outputs = new Map(), responses = new Map();
// phase_id -> every usage payload, and every captured command output tail, in
// event order. A phase in tails ran a command even while its list is empty.
const usage = new Map(), tails = new Map();
// Which disclosures are open, keyed "<phase_id>-<panel>", so switching phases
// and redrawing on each poll leave them as the reader set them.
const panels = new Map();
let after = 0, done = false;
// draining: the last page was full, so rows may be ahead of their events.
// shown: the last poll's run and phases, so a click can redraw after polling
// has stopped. selected: the phase_id in the details card, or ''.
let draining = false, shown = null, selected = '';
let generation = 0, polling = false, fresh = 0, failure = '';
let view = route();

const esc = s => String(s ?? '').replace(/[<&"']/g, c => ({'<':'&lt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
// queued and starting are live states, not failures: a run that has not
// executed yet must not read as one that went wrong.
const live = s => s === 'running' || s === 'queued' || s === 'starting';
const cls = s => s === 'ok' || s === 'success' ? 'ok' : live(s) ? 'running' : 'fail';
const time = s => (s || '').slice(11, 19);
const base = p => (p || '').split('/').filter(Boolean).pop() || p;
const money = n => '$' + (n || 0).toFixed(5);
const count = n => (n || 0).toLocaleString('en-US');
const pct = n => (100 * (n || 0)).toFixed(1) + '%';
// bucket is the list stored under key, created empty on first use.
const bucket = (m, k) => m.get(k) ?? m.set(k, []).get(k);

// route maps the hash to a page. `#/overview` is the landing page and an empty
// hash means the same; `#<run-id>` without a slash is the deep link shape
// earlier versions handed out, and still opens that run.
function route() {
  const h = location.hash.slice(1);
  if (h === '' || h === '/' || h === '/overview') return {page: 'overview'};
  if (h === '/runs') return {page: 'runs'};
  if (h.startsWith('/runs/')) return {page: 'run', id: h.slice(6)};
  if (!h.startsWith('/')) return {page: 'run', id: h};
  return {page: 'missing'};
}

// Every page's fetch carries the generation it started in, so a reply that
// lands after the reader has navigated away is dropped instead of drawn onto
// whatever page is now on screen.
function navigate() {
  view = route();
  generation++;
  after = 0; done = false; failure = '';
  spend.clear(); inputs.clear(); outputs.clear(); responses.clear();
  usage.clear(); tails.clear(); panels.clear();
  draining = false; shown = null; selected = '';
  resized.disconnect(); observed = null;
  app.innerHTML = '';
  followBox.checked = false;
  followLabel.style.display = 'none';
  for (const [id, page] of [['nav-overview', 'overview'], ['nav-runs', 'runs']]) {
    const on = view.page === page || (page === 'runs' && view.page === 'run');
    // Runs stays selected while a single run is open: a run is something
    // inside Runs, not a third place to be.
    if (on) $(id).setAttribute('aria-current', 'page');
    else $(id).removeAttribute('aria-current');
  }
  tick();
}
addEventListener('hashchange', navigate);

async function tick() {
  if (done || polling) return;
  polling = true;
  const current = generation;
  try {
    if (view.page === 'overview') await overview(current);
    else if (view.page === 'runs') await list(current);
    else if (view.page === 'run') await detail(current);
    else missing();
    if (current === generation) { failure = ''; fresh = Date.now(); }
  } catch (e) {
    // The last good values stay on screen; only the freshness note changes.
    // Replacing them with zeroes would read as "you have spent nothing".
    if (current === generation) failure = String(e);
    stamp();
  } finally {
    polling = false;
  }
}

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return {body: await r.json(), total: Number(r.headers?.get?.('X-Total-Runs'))};
}

// stamp writes the right-hand half of the bottom bar: how old what you are
// looking at is, or why it stopped updating.
function stamp() {
  if (failure) {
    note.className = 'stale';
    note.textContent = fresh ? 'stale · ' + ago() + ' · ' + failure : failure;
    return;
  }
  note.className = '';
  note.textContent = done ? 'run complete' : 'updated ' + ago();
}
const ago = () => {
  const s = Math.max(0, Math.round((Date.now() - fresh) / 1000));
  return s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago';
};

function missing() {
  app.innerHTML = `<h2>not found</h2><p class="dim">No page at <code>${esc(location.hash)}</code>.</p>
    <p><a href="#/overview">Overview</a> · <a href="#/runs">Runs</a></p>`;
  bar.textContent = 'Page not found';
  fresh = Date.now();
}

async function overview(current) {
  const {body: o} = await get('/api/overview');
  if (current !== generation) return;

  const runRow = (r, i) => `
    <tr class="run" onclick="location.hash='/runs/${esc(r.run_id)}'">
      <td class="dim">${i + 1}</td>
      <td>${esc(r.workflow)}</td>
      <td class="dim lo">${esc(base(r.repo))}</td>
      <td class="${cls(r.status)}">${esc(r.status)}</td>
      <td class="num cost">${money(r.cost)}</td>
      <td class="wrap lo">${esc(r.request)}</td>
    </tr>`;
  const modelRow = (m, i) => `
    <tr>
      <td class="dim">${i + 1}</td>
      <td>${esc((m.provider || 'unknown') + '/' + (m.model || 'unknown'))}</td>
      <td class="num cost">${money(m.cost)}</td>
      <td class="num dim">${pct(m.share)}</td>
      <td class="num dim lo">${count(m.phases)} phase${m.phases === 1 ? '' : 's'}</td>
    </tr>`;
  const projectRow = (p, i) => `
    <tr>
      <td class="dim">${i + 1}</td>
      <td title="${esc(p.repo)}">${esc(base(p.repo))}</td>
      <td class="num cost">${money(p.cost)}</td>
      <td class="num dim">${pct(p.share)}</td>
      <td class="num dim lo">${count(p.runs)} run${p.runs === 1 ? '' : 's'}</td>
    </tr>`;
  const empty = what => `<tr><td class="dim">No ${what} recorded yet.</td></tr>`;

  app.innerHTML = `
    <div class="card totals">
      <div><b>${count(o.runs)}</b><span>runs recorded</span></div>
      <div class="cost"><b>${money(o.cost)}</b><span>recorded spend</span></div>
    </div>
    <p class="dim">Every run in every repository, for all time.
      Spend updates after each model response.</p>
    <div class="cols">
      <div>
        <div class="card">
          <h2>top projects by spend</h2>
          <table>${o.top_projects.map(projectRow).join('') || empty('project spend')}</table>
        </div>
        <div class="card">
          <h2>top runs by spend</h2>
          <table>${o.top_runs.map(runRow).join('') || empty('runs')}</table>
        </div>
      </div>
      <div class="card">
        <h2>top models by spend</h2>
        <table>${o.top_models.map(modelRow).join('') || empty('model spend')}</table>
        <p class="dim">${attribution(o)}</p>
      </div>
    </div>`;

  bar.innerHTML = 'Overview · all repositories · all time'
    + `<span class="lo"> · ${count(o.tokens)} tok</span>`;
  stamp();
}

// attribution says what the model ranking cannot account for. Shares are of
// total recorded spend, so ten rows are not expected to reach 100%.
function attribution(o) {
  // Counted per phase, not per run: a phase runs on one model, while a run
  // moves between agents and spends on several.
  const parts = [`Share is of ${money(o.cost)} total recorded spend, counted per
    phase — one run's phases can each name a different model.`];
  return esc(parts.join(' ').replace(/\s+/g, ' '));
}

async function list(current) {
  const {body: runs, total} = await get('/api/runs?n=50');
  if (current !== generation) return;
  const repos = new Map();
  let cost = 0, tokens = 0;
  for (const r of runs) {
    cost += r.cost; tokens += r.tokens;
    const k = base(r.repo);
    if (!repos.has(k)) repos.set(k, []);
    repos.get(k).push(r);
  }

  app.innerHTML = [...repos].map(([repo, rows]) => `
    <section class="card">
    <h2>${esc(repo)}</h2>
    <table>${rows.map(r => `
      <tr class="run" onclick="location.hash='/runs/${esc(r.run_id)}'">
        <td class="dim">${esc((r.submitted_at || '').replace('T', ' ').replace('Z', ''))}</td>
        <td class="${cls(r.status)}">${esc(r.status)}</td>
        <td>${esc(r.workflow)}</td>
        <td class="num dim lo">${esc(timings(r))}</td>
        <td class="num dim">${count(r.tokens)} tok</td>
        <td class="num cost">${money(r.cost)}</td>
        <td class="wrap">${esc(r.request)}</td>
      </tr>`).join('')}</table></section>`).join('')
    || '<p class="dim">No runs yet. Start one with <code>lathe scout</code>.</p>';

  // Explicitly "displayed", because these are the 50 most recent and the
  // database holds more.
  const shown = total ? `${count(runs.length)} of ${count(total)} runs` : `${count(runs.length)} runs`;
  bar.innerHTML = `Runs · showing ${shown}`
    + `<span class="lo"> · displayed: ${count(tokens)} tok · <span class="cost">${money(cost)}</span></span>`;
  stamp();
}

async function detail(current) {
  const {body: d} = await get('/api/runs/' + encodeURIComponent(view.id) + '?after=' + after);
  if (current !== generation) return;
  const r = d.run;

  // Folded in before the phases are drawn, not after: a settled run stops
  // polling at the end of this pass, so a total added later never gets drawn.
  for (const e of d.events) {
    if (e.type === 'input' || isCommand(e)) {
      // Rendered once, on arrival: the details card is redrawn every poll, and
      // re-escaping every system prompt each second is the cost of not doing it.
      inputs.set(e.phase_id, (inputs.get(e.phase_id) || '') +
        `<p>${e.type === 'input' ? 'Agent turn' : 'Command'}</p><pre>${esc(text(e.payload, 2))}</pre>`);
    }
    if (isCommand(e)) bucket(tails, e.phase_id);
    if (e.type === 'log' && e.name === 'output') bucket(tails, e.phase_id).push(text(e.payload));
    if (e.type === 'output') outputs.set(e.phase_id, e.payload?.report);
    if ((e.type === 'output' || e.type === 'envelope' || e.type === 'gate') && typeof e.payload?.text === 'string') {
      responses.set(e.phase_id, (responses.get(e.phase_id) || '') +
        `<p>Response ${(e.payload.attempt ?? 0) + 1}${e.type !== 'output' ? ' · rejected' : ''}</p><pre>${esc(e.payload.text)}</pre>`);
    }
    if (e.type !== 'usage' || !e.payload) continue;
    bucket(usage, e.phase_id).push(e.payload);
    const s = spend.get(e.phase_id) || { model: '', tokens: 0, cost: 0 };
    s.tokens += e.payload.tokens || 0;
    s.cost += e.payload.cost || 0;
    s.model = e.payload.model || s.model;   // absent on runs traced before it was recorded
    spend.set(e.phase_id, s);
  }

  // A settled run is final: the phases and the log below are the whole of it,
  // so the poll stops rather than re-running three queries every second. A full
  // page means the server capped this poll and there is more to fetch first.
  draining = d.events.length >= PAGE;
  if (!live(r.status) && !draining) done = true;
  followLabel.style.display = (view.page === 'run' && !done) ? 'inline-flex' : 'none';

  // The header, chart and details are re-rendered every poll; the log is
  // appended, so scrolling through a finished phase is not undone a second later.
  if (!$('log')) {
    app.innerHTML = `
      <p><a href="#/runs">&larr; all runs</a></p>
      <div class="card"><p id="head"></p></div>
      <section class="card"><h2>phases</h2><div id="phases"></div></section>
      <section class="card" id="phase"></section>
      <section class="card"><h2>events</h2><table id="log"></table></section>`;
  }
  $('head').innerHTML =
    `<b>${esc(r.repo)}</b><br><span class="dim">${esc(r.request)}</span>`;
  const following = app.scrollTop + app.clientHeight >= app.scrollHeight - 40;
  shown = {run: r, phases: d.phases};
  draw();

  bar.innerHTML = `${esc(r.workflow)} · <span class="${cls(r.status)}">${esc(r.status)}</span>`
    + ` · ${count(r.tokens)} tok · <span class="cost">${money(r.cost)}</span>`
    + ` · ${timings(r)}<span class="lo"> · ${esc(base(r.repo))} · ${esc(r.run_id)}</span>`;
  stamp();

  // Follow the tail, but only for someone already at the bottom: measure
  // before appending, or the new rows have already moved the answer. Scrolling
  // up to read a tool call is how you say "stop following".
  const log = $('log');
  for (const e of d.events) {
    after = e.event_id;
    const row = log.insertRow();
    row.innerHTML = `
      <td class="dim">${time(e.at)}</td>
      <td class="${failed(e) ? 'fail' : ''}">${esc(e.type)}</td>
      <td>${esc(e.name)}</td>
      <td>${eventPayload(e)}</td>`;
  }
  if (d.events.length && following && followBox.checked) app.scrollTop = app.scrollHeight;
}

// timings keeps waiting and working apart: a run that sat in the queue for a
// minute is not a run that took a minute to do.
function timings(r) {
  const queued = span(r.submitted_at, r.started_at);
  const ran = span(r.started_at, r.ended_at);
  const parts = [];
  if (queued) parts.push(queued + ' queued');
  if (ran) parts.push(ran + (r.ended_at ? '' : ' elapsed'));
  return parts.join(' · ');
}

// span is one stage's duration; an unfinished stage is measured against now.
function span(from, to) {
  const start = Date.parse(from), end = to ? Date.parse(to) : Date.now();
  if (!start || !(end >= start)) return '';
  return dur(end - start);
}
const dur = ms => {
  const s = Math.round(ms / 1000);
  return s < 60 ? s + 's' : Math.floor(s / 60) + 'm' + String(s % 60).padStart(2, '0') + 's';
};

// draw renders the chart and the selected phase from the last poll's data, so
// a click redraws the same run even after polling has stopped. Now is read
// once, so the axis, the blocks and the durations all agree.
function draw() {
  const chart = $('phases');
  if (!shown || !chart) return;
  const {run: r, phases} = shown, now = Date.now();
  swap(chart, gantt(r, phases, now));
  swap($('phase'), details(phases.find(p => p.phase_id === selected), r, now));
  layout();
  if (observed !== chart) { resized.observe(chart); observed = chart; }
}

// Clicking the selected block again clears the details card.
function pick(id) {
  selected = selected === id ? '' : id;
  draw();
}

// swap replaces a region's markup and, only when focus was inside it, puts
// focus back on the matching control without scrolling the reader anywhere.
function swap(el, html) {
  const a = document.activeElement;
  const key = a && el.contains(a) ? a.dataset?.focus : undefined;
  el.innerHTML = html;
  if (!key) return;
  for (const x of el.querySelectorAll('[data-focus]')) {
    if (x.dataset.focus === key) { x.focus({preventScroll: true}); return; }
  }
}

// phaseTiming is the one reading of a phase's status and span the chart and
// the details card share. The stored status is fail until Finish earns
// success, so a phase with no end reads running while its run is live and
// interrupted once it is not — bounded by the run's end, never by now, or a
// finished run's phase would keep growing.
function phaseTiming(p, r, now) {
  const start = Date.parse(p.started_at);
  if (p.ended_at) return {status: p.status, start, end: Date.parse(p.ended_at), bound: false};
  if (live(r.status)) return {status: 'running', start, end: now, bound: false};
  return {status: 'interrupted', start, end: Date.parse(r.ended_at), bound: true};
}
const tone = s => s === 'interrupted' ? 'interrupted' : cls(s);
// The chart marks status beside the name; the word stays in the accessible
// name and the details card.
const MARK = {success: '✅', ok: '✅', fail: '❌', running: '⏳', interrupted: '⚠️'};

// axis spans the run's own execution: queue time is left out, as in timings().
// A span of at least 1ms keeps a zero-duration run from dividing by zero.
function axis(r, now) {
  const start = Date.parse(r.started_at);
  if (!(start >= 0)) {
    return {note: live(r.status) ? 'Waiting for run to start.' : 'Timing unavailable: the run has no recorded start.'};
  }
  const end = r.ended_at ? Date.parse(r.ended_at) : live(r.status) ? Math.max(now, start) : NaN;
  if (!(end >= start)) return {note: 'Timing unavailable: the run has no valid end.'};
  return {start, end, span: Math.max(1, end - start), live: !r.ended_at};
}

// geometry places an interval on the axis in percent, clamped to it, or null
// when its timestamps are missing, invalid or reversed. NaN fails every
// comparison, so nothing here can emit NaN, infinity or a negative width.
function geometry(t, ax) {
  if (!(t.start >= 0 && t.end >= t.start)) return null;
  const clamp = ms => Math.min(Math.max(ms, ax.start), ax.end);
  const s = clamp(t.start), e = clamp(t.end);
  return {left: (s - ax.start) / ax.span * 100, width: (e - s) / ax.span * 100};
}

// gantt draws one row per graph node, in the order each was first entered. A
// re-entry after a send-back is another block on the same row.
function gantt(r, phases, now) {
  const ax = axis(r, now);
  if (!phases.length) return `<p class="dim">${ax.note && live(r.status) ? ax.note : 'No phases recorded yet.'}</p>`;
  const rows = new Map(), untimed = [];
  for (const p of [...phases].sort((a, b) => a.seq - b.seq)) {
    const t = phaseTiming(p, r, now), g = ax.note ? null : geometry(t, ax);
    if (!g) { untimed.push(block(p, t)); continue; }
    bucket(rows, p.name).push(block(p, t, g));
  }
  // UTC throughout, matching every other timestamp on the page.
  const edge = ms => time(new Date(ms).toISOString()) + ' UTC';
  return (ax.note ? `<p class="dim">${ax.note}</p>` : '')
    + (rows.size ? `<div class="gantt"><span></span>
        <div class="axis"><span>${edge(ax.start)}</span><span>${ax.live ? 'now' : edge(ax.end)}</span></div>
        ${[...rows].map(([name, blocks]) =>
          `<div class="node" title="${esc(name)}">${esc(name)}</div><div class="track">${blocks.join('')}</div>`).join('')}
      </div>` : '')
    + (untimed.length ? `<p class="dim">Untimed · timestamps missing or invalid</p><div class="untimed">${untimed.join('')}</div>` : '');
}

// block is one phase entry. Model and cost are omitted when no usage was
// recorded, so an engineer phase does not read "$0.00000" as though it had
// been asked; a recorded zero still shows. The 2px floor is only visual, and
// min() keeps that floor inside the track at its right edge.
function block(p, t, g) {
  const s = spend.get(p.phase_id);
  const lines = [[p.name, MARK[t.status] || '❔'], [s?.model, s && money(s.cost)].filter(Boolean)];
  const name = [`#${p.seq} ${p.name}`, s?.model, t.status, s && money(s.cost)].filter(Boolean).join(' · ');
  const at = g ? ` style="left:min(${g.left.toFixed(3)}%, calc(100% - 2px));width:max(2px, ${g.width.toFixed(3)}%)"` : '';
  return `<button type="button" class="block ${tone(t.status)}"${at} data-owner="${esc(p.owner)}" data-lines="${lines[1].length ? 2 : 1}" data-phase="${esc(p.phase_id)}"`
    + ` data-focus="${esc('block-' + p.phase_id)}" aria-pressed="${selected === p.phase_id}"`
    + ` aria-label="${esc(name)}" title="${esc(name)}" onclick="pick(this.dataset.phase)">`
    + lines.map((line, l) => line.map((x, j) =>
      `<span class="piece${!l && j ? ' mark' : ''}" data-line="${l}">${esc(x)}</span>`).join('')).join('')
    + '</button>';
}

// Labels keep a gap from their block and from whatever they sit beside, and
// pieces sharing a line sit SEP apart. A lane is one block's height plus the
// space between sublanes. Cut below FEW pixels, a piece is a stray glyph, so
// it is hidden instead.
const GAP = 4, SEP = 14, LANE = 40, FEW = 24;
// fit counts the leading pieces of a line that fit in room; spread is the width
// those pieces take side by side.
const spread = ws => ws.reduce((a, w, i) => a + w + (i ? SEP : 0), 0);
const fit = (ws, room) => { let n = 0; while (n < ws.length && spread(ws.slice(0, n + 1)) <= room) n++; return n; };

// arrange lays one node row out from measured pixels. Each block takes the
// first sublane it does not overlap, so minimum-width blocks stay selectable.
// Its label is two lines of pieces, and each line keeps inside the block the
// leading pieces that fit there, in reading order. The rest of every line go
// to the right, else the left, else the wider of the two, where a piece that
// still does not fit is cut, or hidden when too narrow to read. A label never
// reaches over another block or another block's label.
//
// Each block is {left, width, lines: [[piece width, …], …]}; each placement
// is {x, sep, cut?} or {hidden}, with x from the block's left edge.
function arrange(blocks, width) {
  const out = blocks.map(() => ({lane: 0, side: '', lines: []}));
  const order = blocks.map((b, i) => i).sort((a, b) => blocks[a].left - blocks[b].left);
  const ends = [], lanes = [];
  for (const i of order) {
    const b = blocks[i];
    let lane = ends.findIndex(end => b.left >= end);
    if (lane < 0) lane = ends.length;
    ends[lane] = b.left + b.width;
    out[i].lane = lane;
    (lanes[lane] ||= []).push(i);
  }
  for (const members of lanes) {
    let used = 0;   // right edge of the previous block or its right-hand label
    members.forEach((i, k) => {
      const b = blocks[i], right = b.left + b.width;
      const next = k + 1 < members.length ? blocks[members[k + 1]].left : width;
      const room = {right: next - right - 2 * GAP, left: b.left - used - 2 * GAP};
      const inside = b.width - 2 * GAP;
      const kept = b.lines.map(ws => fit(ws, inside));
      const need = Math.max(0, ...b.lines.map((ws, l) => spread(ws.slice(kept[l]))));
      const side = need <= room.right ? 'right' : need <= room.left ? 'left' : room.right >= room.left ? 'right' : 'left';
      const space = room[side];
      let reach = 0;   // widest line put beside the block
      out[i].side = need ? side : '';
      out[i].lines = b.lines.map((ws, l) => {
        const spots = [];
        let x = GAP;
        const place = (w, sep, cut) => { spots.push(cut === undefined ? {x, sep} : {x, sep, cut}); x += cut ?? (w + (sep ? SEP : 0)); };
        let n = kept[l];
        // A name too long for either side is better cut inside a block
        // that has more room for it than the side does.
        if (!n && ws.length && ws[0] > space && inside > space && inside >= FEW) { place(ws[0], false, inside); n = 1; }
        else ws.slice(0, n).forEach((w, j) => place(w, j > 0));
        const rest = ws.slice(n);
        if (!rest.length) return spots;
        const shown = fit(rest, space);
        const left = space - spread(rest.slice(0, shown)) - (shown ? SEP : 0);
        const cut = shown < rest.length && left >= FEW ? left + (shown ? SEP : 0) : undefined;
        const total = spread(rest.slice(0, shown)) + (cut ?? 0);
        x = side === 'right' ? b.width + GAP : -GAP - total;
        rest.forEach((w, j) => {
          if (j < shown) place(w, j > 0);
          else if (j === shown && cut !== undefined) place(w, j > 0, cut);
          else spots.push({hidden: true});
        });
        if (side === 'right') reach = Math.max(reach, total);
        return spots;
      });
      used = right + (reach ? GAP + reach : 0);
    });
  }
  return out;
}

// layout measures each row and applies arrange(). Placements are cleared
// first, so the last one does not decide this one.
function layout() {
  const chart = $('phases');
  if (!chart) return;
  // Every reset, then every read, then every write: one reflow, not one per row.
  const rows = [...chart.querySelectorAll('.track')].map(track => ({track, blocks: [...track.querySelectorAll('.block')].map(el =>
    ({el, lines: [0, 1].map(l => [...el.children].filter(c => c.dataset.line === String(l)))}))}));
  for (const {blocks} of rows) for (const b of blocks) for (const c of b.lines.flat()) {
    c.style.left = ''; c.style.maxWidth = ''; c.style.display = ''; c.dataset.sep = '';
  }
  for (const row of rows) row.spots = arrange(row.blocks.map(b =>
    ({left: b.el.offsetLeft, width: b.el.offsetWidth, lines: b.lines.map(cs => cs.map(c => c.scrollWidth))})),
    row.track.clientWidth);
  for (const {track, blocks, spots} of rows) {
    spots.forEach((s, i) => {
      blocks[i].el.style.top = s.lane * LANE + 1 + 'px';
      s.lines.forEach((line, l) => line.forEach((spot, j) => {
        const c = blocks[i].lines[l][j];
        if (spot.hidden) { c.style.display = 'none'; return; }
        c.style.left = spot.x + 'px';
        c.dataset.sep = spot.sep ? '1' : '';
        if (spot.cut !== undefined) c.style.maxWidth = spot.cut + 'px';
      }));
    });
    track.style.height = (Math.max(0, ...spots.map(s => s.lane)) + 1) * LANE + 'px';
  }
}

// Label room depends on the track's pixel width, which moves with the window
// and the navigation rail. One frame coalesces a burst of resize callbacks.
let observed = null, measuring = false;
const resized = new ResizeObserver(() => {
  if (measuring) return;
  measuring = true;
  requestAnimationFrame(() => { measuring = false; layout(); });
});

// Output is rendered as text, never interpreted as HTML or Markdown from an
// agent. These reports are snapshots of this phase, not the final plan on disk.
function reportList(title, items, ordered = false, empty = 'None.') {
  const tag = ordered ? 'ol' : 'ul';
  const list = Array.isArray(items) ? items : [];
  return `<h4>${esc(title)}</h4>` + (list.length
    ? `<${tag}>${list.map(item => `<li>${esc(item)}</li>`).join('')}</${tag}>`
    : `<p class="dim">${esc(empty)}</p>`);
}

// renderReport walks any other agent's report as data: strings are
// paragraphs, arrays lists, objects labelled fields, and every other value is
// spelled out so null, false and zero do not vanish. Keys go through esc() too.
function renderReport(v) {
  if (Array.isArray(v)) {
    return v.length ? `<ul>${v.map(x => `<li>${x !== null && typeof x === 'object' ? renderReport(x) : esc(String(x))}</li>`).join('')}</ul>`
      : '<p class="dim">Empty list.</p>';
  }
  if (v !== null && typeof v === 'object') {
    const keys = Object.keys(v);
    return keys.length ? keys.map(k => `<h4>${esc(k)}</h4>${renderReport(v[k])}`).join('')
      : '<p class="dim">Empty object.</p>';
  }
  return `<p>${esc(String(v))}</p>`;
}

function details(p, r, now) {
  if (!p) return '<h2>phase</h2><p class="dim">Select a phase.</p>';
  const id = p.phase_id, t = phaseTiming(p, r, now), s = spend.get(id);
  // Rows can arrive before their events: say so until the backlog is drained,
  // and only then that something was not recorded.
  const absent = (what, none) =>
    `<p class="dim">${draining ? `Loading ${what}…` : t.status === 'running' ? `Waiting for ${what}.` : none}</p>`;
  const disclosure = (key, title, body, cls = '') => {
    const k = id + '-' + key;
    return `<details data-panel="${esc(k)}" ${panels.get(k) ? 'open' : ''} ontoggle="panels.set(this.dataset.panel, this.open)">`
      + `<summary data-focus="${esc(k)}"${cls ? ` class="${cls}"` : ''}>${title}</summary>${body}</details>`;
  };

  const valid = t.start >= 0 && t.end >= t.start;
  const took = !valid ? 'Unavailable'
    : dur(t.end - t.start) + (t.status === 'running' ? ' so far' : t.bound ? ' · bounded by the run’s end' : '');
  const facts = `<table class="facts">
      <tr><th>Started</th><td>${esc(p.started_at || 'Not recorded')}</td></tr>
      <tr><th>Ended</th><td>${esc(p.ended_at || 'Not recorded')}${t.bound && r.ended_at ? ` <span class="dim">· run ended ${esc(r.ended_at)}</span>` : ''}</td></tr>
      <tr><th>Duration</th><td>${took}</td></tr>
    </table>`;

  // The first line stays in the summary, so a collapsed error still reads.
  const first = (p.error || '').split('\n')[0];
  const error = p.error ? disclosure('error', `Error · ${esc(first.length > 120 ? first.slice(0, 120) + '…' : first)}`,
    `<pre class="fail">${esc(p.error)}</pre>`, 'fail') : '';

  const report = outputs.get(id);
  let result = '';
  if (report && p.owner === 'planner') {
    result = `<h3>Plan</h3><p>${esc(report.summary)}</p>`
      + reportList('Steps', report.steps, true)
      + reportList('Allowed files', report.files)
      + reportList('Risks', report.risks, false, 'No risks reported.');
  } else if (report && p.owner === 'plan-reviewer') {
    const feedback = Array.isArray(report.feedback) ? report.feedback : null;
    result = `<h3>Review</h3><p>${esc(report.summary)}</p>`
      + (feedback?.length === 0
        ? '<p class="ok">Accepted · no objections.</p>'
        : reportList('Feedback', feedback, false, 'Feedback not recorded.'));
  } else if (report !== undefined) {
    result = `<h3>Output</h3>${renderReport(report)}`;
  } else if (p.owner !== 'engineer' && !tails.has(id)) {
    // A later test round only runs the command, so it has no report to miss.
    result = absent('phase output', 'Structured output not recorded for this phase.');
  }

  const outs = tails.get(id);
  const command = !outs ? '' : '<h3>Command output</h3>' + (outs.length
    ? outs.map(o => o ? `<pre>${esc(o)}</pre>` : '<p class="dim">The command produced no output.</p>').join('')
    : absent('command output', 'Command output not recorded.'));

  const uses = usage.get(id);
  const spent = p.owner === 'engineer' ? '' : '<h3>Usage</h3>' + (uses ? `
    <p>${count(s.tokens)} tok · <span class="cost">${money(s.cost)}</span></p>
    <table class="facts">${uses.map(u => `<tr>
      <td class="dim">attempt ${(u.attempt ?? 0) + 1}</td><td class="dim">response ${esc(u.seq ?? '?')}</td>
      <td>${esc((u.provider || 'unknown') + '/' + (u.model || 'unknown'))}</td>
      <td class="num">${count(u.tokens)} tok</td><td class="num cost">${money(u.cost)}</td></tr>`).join('')}</table>`
    : absent('usage', 'Usage not recorded.'));

  return `<h2>phase</h2>
    <p><b>${esc(p.name)}</b> <span class="dim">· #${p.seq} · ${esc(p.owner)} ·</span> <span class="${tone(t.status)}">${esc(t.status)}</span></p>`
    + facts + error
    + `<div class="phase-output">${result}${command}${spent}</div>`
    + disclosure('raw', 'Raw responses', responses.get(id) || '<p class="dim">Raw response not recorded here. Older responses may be available in the run’s raw.jsonl.</p>')
    + disclosure('inputs', 'Inputs', inputs.get(id) || '<p class="dim">Input context not recorded.</p>');
}

const failed = e => e.type === 'error' || (e.type === 'tool_call' && e.payload?.isError);
const isCommand = e => e.type === 'log' && e.name === 'command';
// Indented for a panel, compact for a one-line preview; one dispatch either way.
const text = (p, indent) => p == null ? '' : typeof p === 'string' ? p : JSON.stringify(p, null, indent);
function eventPayload(e) {
  // Commands and failures stay visible in full, including a blocked call's reason.
  const whole = failed(e) || isCommand(e) || (e.type === 'tool_call' && e.name === 'bash');
  const body = esc(text(e.payload, 2)), bad = failed(e) ? ' class="fail"' : '';
  const s = text(e.payload);
  const head = whole ? body : esc(s.length > 300 ? s.slice(0, 300) + '…' : s);
  // Nothing hidden means nothing to disclose: a triangle that expands to the
  // same text is a control that does nothing.
  return head === body ? `<pre${bad}>${body}</pre>`
    : `<details><summary><pre${bad}>${head}</pre></summary><pre>${body}</pre></details>`;
}

// The version is the serving binary's, asked for once. It is not in the HTML,
// so an old page cached in a browser cannot claim to be a new one.
function meta() {
  get('/api/meta').then(({body}) => { $('version').textContent = body.version; })
                  .catch(() => { $('version').textContent = '?'; });
}

// One timer for every page, because only one page is ever on screen. It ticks
// faster than the slowest page refreshes so the "updated Ns ago" note keeps
// counting between fetches.
let last = 0;
setInterval(() => {
  stamp();
  const wait = POLL[view.page];
  if (wait && Date.now() - last >= wait) { last = Date.now(); tick(); }
}, 500);

meta();
navigate();
</script>

<script>
// Theme and the navigation rail: two preferences, one place, both surviving a
// browser that refuses localStorage. ponytail: three theme states in one
// button, no settings pane.
(() => {
  const ICON = {auto: '◐', light: '☀', dark: '☾'}, ORDER = ['auto', 'light', 'dark'];
  const read = (key, fallback) => {
    try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
  };
  const write = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

  const button = document.getElementById('theme');
  let mode = read('lathe-theme', 'auto');
  if (!ORDER.includes(mode)) mode = 'auto';
  const apply = () => {
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    button.textContent = ICON[mode];
    button.title = mode === 'auto' ? 'Theme: follow system' : `Theme: ${mode}`;
  };
  button.addEventListener('click', () => {
    mode = ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length];
    write('lathe-theme', mode);
    apply();
  });
  apply();

  const collapse = document.getElementById('collapse');
  let nav = read('lathe-nav', 'expanded') === 'collapsed';
  const showNav = () => {
    document.body.dataset.nav = nav ? 'collapsed' : 'expanded';
    collapse.setAttribute('aria-expanded', String(!nav));
    collapse.title = nav ? 'Expand navigation' : 'Collapse navigation';
    collapse.querySelector('svg').style.transform = nav ? 'rotate(180deg)' : '';
  };
  collapse.addEventListener('click', () => {
    nav = !nav;
    write('lathe-nav', nav ? 'collapsed' : 'expanded');
    showNav();
  });
  showNav();
})();
</script>
