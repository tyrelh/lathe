# Implement the accepted plan, with no shell.
provider: anthropic
model: claude-opus-5-5
thinking: low
timeout: 10m
# Routing tiers, cheapest first. These spell out provider, model and thinking so agent-level model edits do not shift them. The default matches the model above, so routing failure lands on the unrouted model.
tiers:
  - when: Mechanical change in one or two files; the plan spells out every edit
    provider: anthropic
    model: claude-sonnet-5-5
    thinking: low
  - when: Behaviour change within one area; some judgment about existing code needed
    provider: anthropic
    model: claude-opus-5-5
    thinking: low
    default: true
  - when: Cross-cutting change, concurrency, migrations, or an under-specified plan
    provider: anthropic
    model: claude-opus-5-5
    thinking: medium
