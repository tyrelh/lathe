# Read the repo and produce the plan the builder implements; change nothing.
provider: anthropic
model: claude-opus-5-5
thinking: medium
timeout: 10m
# Routing tiers, cheapest first. These spell out provider, model and thinking so agent-level model edits do not shift them. The default matches the model above, so routing failure lands on the unrouted model.
tiers:
  - when: Small, well-specified request; the files to change and the approach are obvious
    provider: anthropic
    model: claude-sonnet-5-5
    thinking: medium
  - when: Typical fix or feature in one area; the planner has to read around to choose an approach
    provider: anthropic
    model: claude-opus-5-5
    thinking: medium
    default: true
  - when: Cross-cutting or open-ended request, design decisions, or an issue that leaves the approach unclear
    provider: anthropic
    model: claude-opus-5-5
    thinking: xhigh
